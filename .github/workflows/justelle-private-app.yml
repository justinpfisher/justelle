name: Justelle private pilot (fictional only)
on:
  push:
    branches: ['feat/private-shared-app-v1']
    paths:
      - 'private-app/**'
      - '.github/workflows/justelle-private-app.yml'
  pull_request:
    paths:
      - 'private-app/**'
      - '.github/workflows/justelle-private-app.yml'
  workflow_dispatch:
jobs:
  private-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
        working-directory: private-app
      - run: npm run build
        working-directory: private-app
      - run: npm run test:archive
        working-directory: private-app
      - run: npm run test:rules
        working-directory: private-app
      - run: npx playwright install --with-deps chromium
        working-directory: private-app
      - run: npm run test:browser
        working-directory: private-app
      - run: npm run test:preview
        working-directory: private-app

  windows-preview:
    name: Windows preview shutdown
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm.cmd ci --no-audit --no-fund
        working-directory: private-app
      - run: npm.cmd run test:preview
        working-directory: private-app
