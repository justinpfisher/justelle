name: Justelle infrastructure PoC (fictional data)
on:
  push:
    branches: ['poc/shared-infrastructure-comparison']
  pull_request:
    paths:
      - 'poc/**'
      - '.github/workflows/justelle-infrastructure-poc.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
        working-directory: poc
      - run: npm run test:cloudflare
        working-directory: poc
      - run: npm run test:firebase
        working-directory: poc
      - run: npx playwright install --with-deps chromium
        working-directory: poc
      - run: npm run test:firebase:browser
        working-directory: poc
