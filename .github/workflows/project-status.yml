name: Justelle project status (milestone evidence)

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [closed, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - .github/justelle-milestones.json
      - .github/workflows/project-status.yml
      - scripts/update-project-status.mjs
      - scripts/project-status.test.mjs
  workflow_dispatch:
  schedule:
    - cron: '19 12 * * *'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: justelle-project-status-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test status calculation and fail-closed acceptance logic
        run: node --test scripts/project-status.test.mjs
      - name: Generate project status from live milestone issue checklists
        run: node scripts/update-project-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Commit changed dashboard only
        run: |
          if ! git diff --quiet -- README.md docs/WHERE-WE-ARE.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md docs/WHERE-WE-ARE.md
            git commit -m 'docs: refresh Justelle milestone status [skip ci]'
            git push origin HEAD:main
          else
            echo 'Status was already current.'
          fi
