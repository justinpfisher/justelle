<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f1faf9" />
  <meta name="description" content="Justelle. Still us. Our time together, and room for the next adventure." />
  <title>Justelle. Still us.</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #193b42;
      --ink-soft: #526b6f;
      --teal: #177d80;
      --line: #d7e8e5;
      --paper: #fcfefd;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 280px;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 8% 12%, #dcefeb 0, transparent 48%),
        radial-gradient(ellipse at 94% 85%, #e5f0e9 0, transparent 45%),
        #f1faf9;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(1160px, calc(100% - 64px));
      margin: 48px auto 32px;
    }

    .keepsake {
      overflow: hidden;
      border: 1px solid #ffffff;
      border-radius: 32px;
      background: var(--paper);
      box-shadow: 0 24px 80px #193b420d;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
      align-items: center;
      gap: 40px;
      padding: 62px 64px 0 38px;
    }

    .portrait-side {
      position: relative;
      align-self: end;
      margin: 0;
      isolation: isolate;
    }

    .portrait-side::before {
      position: absolute;
      inset: 14% 3% 0;
      z-index: -1;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #edf7f4, #f8fcf9);
      content: "";
    }

    .portrait {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 20px #193b4209);
    }

    .intro { padding-bottom: 44px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 25px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 7.2vw, 88px);
      font-weight: 400;
      letter-spacing: -0.065em;
      line-height: 1.02;
    }

    h1 span {
      display: block;
      color: var(--teal);
      font-style: italic;
    }

    .lede {
      margin-bottom: 30px;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.6;
    }

    .milestones {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .milestone h2 {
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 500;
    }

    .elapsed {
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }

    .year-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .year-unit { margin-left: 3px; font-size: 14px; }

    .extra-days {
      display: block;
      min-height: 1.5em;
      margin-top: 6px;
      color: var(--teal);
      font-size: 13px;
      line-height: 1.5;
    }

    .since {
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.6;
    }

    .anniversary {
      margin: 24px 0 0;
      border-left: 2px solid var(--teal);
      padding: 10px 14px;
      color: var(--teal);
      background: #eff8f4;
      font-size: 14px;
      line-height: 1.6;
    }

    .plans {
      border-top: 1px solid var(--line);
      padding: 32px 48px 38px;
      background: linear-gradient(120deg, #f5faf6, #eff8f6);
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -0.025em;
    }

    .section-heading::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .trip-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trip {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      border: 1px solid #dce9e1;
      border-radius: 16px;
      padding: 23px 24px;
      background: #fcfefb;
    }

    .trip-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      color: #59765d;
      background: #edf3e9;
    }

    .trip-icon.sea { color: #327d83; background: #e8f4f3; }

    .trip-icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trip h3 {
      margin-bottom: 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.035em;
    }

    .trip-date { margin-bottom: 8px; color: var(--ink-soft); font-size: 13px; }
    .trip-status { margin-bottom: 0; color: var(--teal); font-size: 11px; }

    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 24px;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    .footer svg { width: 13px; height: 13px; flex-shrink: 0; fill: var(--teal); }

    @media (max-width: 1000px) {
      .page { width: calc(100% - 40px); margin-top: 28px; }
      .hero { gap: 28px; padding: 44px 36px 0 24px; }
      h1 { font-size: 68px; }
      .milestones { gap: 14px; }
      .plans { padding: 30px 32px; }
      .trip { gap: 14px; padding: 20px; }
    }

    @media (max-width: 720px) {
      .page { width: min(520px, calc(100% - 28px)); margin-top: 18px; }
      .keepsake { border-radius: 24px; }
      .hero { grid-template-columns: 1fr; gap: 0; padding: 36px 28px 0; }
      .intro { grid-row: 1; padding-bottom: 24px; }
      .eyebrow { margin-bottom: 18px; }
      h1 { font-size: 68px; }
      .lede { margin-bottom: 24px; font-size: 15px; }
      .milestones { padding-top: 20px; }
      .portrait-side { width: min(100%, 320px); justify-self: center; }
      .plans { padding: 26px 22px; }
      .section-heading h2 { font-size: 24px; }
      .trip-list { grid-template-columns: 1fr; gap: 14px; }
      .trip { padding: 18px; }
      .footer { margin-top: 20px; font-size: 10px; }
    }

    @media (max-width: 360px) {
      .hero { padding: 30px 20px 0; }
      h1 { font-size: 58px; }
      .year-number { font-size: 38px; }
      .plans { padding: 24px 16px; }
      .trip { grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 16px; }
      .trip-icon { width: 48px; height: 48px; }
      .trip-icon svg { width: 32px; height: 32px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="keepsake">
      <section class="hero" aria-labelledby="page-title">
        <figure class="portrait-side">
          <img class="portrait" src="justelle-caricature.png" width="1088" height="1269"
            alt="Justin and Estelle, smiling together in their sunglasses." fetchpriority="high" />
        </figure>

        <div class="intro">
          <p class="eyebrow">Our story, since 2006</p>
          <h1 id="page-title">Justelle.<span>Still us.</span></h1>
          <p class="lede">And the story keeps going.</p>

          <div class="milestones">
            <section class="milestone" aria-labelledby="together-title">
              <h2 id="together-title">Together</h2>
              <p class="elapsed" id="together-elapsed" hidden>
                <span class="year-number" id="together-years"></span>
                <span class="year-unit" id="together-year-unit">years</span>
                <span class="extra-days" id="together-days"></span>
              </p>
              <p class="since">Since <time datetime="2006-08-11">August 11, 2006</time></p>
            </section>

            <section class="milestone" aria-labelledby="married-title">
              <h2 id="married-title">Married</h2>
              <p class="elapsed" id="married-elapsed" hidden>
                <span class="year-number" id="married-years"></span>
                <span class="year-unit" id="married-year-unit">years</span>
                <span class="extra-days" id="married-days"></span>
              </p>
              <p class="since">Since <time datetime="2011-06-24">June 24, 2011</time></p>
            </section>
          </div>

          <p class="anniversary" id="anniversary" role="status" hidden></p>
        </div>
      </section>

      <section class="plans" id="plans" aria-labelledby="plans-title">
        <div class="section-heading"><h2 id="plans-title">Next up for us</h2></div>
        <ul class="trip-list">
          <li class="trip" data-plan-month="2027-07">
            <div class="trip-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48"><path d="M4 36 18 12l14 24M25 24l6-10 13 22M6 36h37M12 22l6 4 5-5" /><path d="m28 20 3 3 3-3" /></svg>
            </div>
            <div>
              <h3>Calgary</h3>
              <p class="trip-date"><time datetime="2027-07">July 2027</time></p>
              <p class="trip-status" hidden></p>
            </div>
          </li>
          <li class="trip" data-plan-month="2028-03">
            <div class="trip-icon sea" aria-hidden="true">
              <svg viewBox="0 0 48 48"><circle cx="33" cy="13" r="5" /><path d="M5 29c4-4 8-4 12 0s8 4 12 0 8-4 14 0M5 37c4-4 8-4 12 0s8 4 12 0 8-4 14 0M7 21h14" /></svg>
            </div>
            <div>
              <h3>Philippines</h3>
              <p class="trip-date"><time datetime="2028-03">March 2028</time></p>
              <p class="trip-status" hidden></p>
            </div>
          </li>
        </ul>
      </section>
    </div>

    <footer class="footer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2 14.5 2 7.5A5.5 5.5 0 0 1 12 4a5.5 5.5 0 0 1 10 3.5C22 14.5 12 21 12 21Z" /></svg>
      <span>Made for Justelle. Room for the next adventure.</span>
    </footer>
  </main>

  <script>
    const milestones = [
      { id: "together", year: 2006, month: 8, day: 11 },
      { id: "married", year: 2011, month: 6, day: 24 }
    ];
    const dayFormatter = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Toronto",
      year: "numeric", month: "numeric", day: "numeric"
    });

    function torontoDate(now) {
      const parts = {};
      for (const { type, value } of dayFormatter.formatToParts(now)) {
        if (type !== "literal") parts[type] = Number(value);
      }
      return parts;
    }

    function elapsedSince(start, today) {
      // Compare calendar dates, so daylight-saving changes never add or lose a day.
      let years = today.year - start.year;
      if (today.month < start.month || (today.month === start.month && today.day < start.day)) {
        years -= 1;
      }
      const lastAnniversary = Date.UTC(start.year + years, start.month - 1, start.day);
      const currentDay = Date.UTC(today.year, today.month - 1, today.day);
      return { years, days: Math.round((currentDay - lastAnniversary) / 86400000) };
    }

    function refreshPage(now = new Date()) {
      const today = torontoDate(now);
      let greeting = "";

      for (const milestone of milestones) {
        const { years, days } = elapsedSince(milestone, today);
        document.getElementById(`${milestone.id}-years`).textContent = String(years);
        document.getElementById(`${milestone.id}-year-unit`).textContent = years === 1 ? "year" : "years";
        document.getElementById(`${milestone.id}-days`).textContent =
          days === 0 ? "and counting" : `and ${days} ${days === 1 ? "day" : "days"}`;
        document.getElementById(`${milestone.id}-elapsed`).hidden = false;

        if (days === 0) {
          const occasion = milestone.id === "together" ? "together" : "married";
          greeting = `${years} ${years === 1 ? "year" : "years"} ${occasion} today. Happy anniversary, us.`;
        }
      }

      const anniversary = document.getElementById("anniversary");
      if (anniversary.textContent !== greeting) anniversary.textContent = greeting;
      anniversary.hidden = !greeting;
      document.title = greeting ? "Happy anniversary, Justelle." : "Justelle. Still us.";

      let upcomingPlans = 0;
      for (const trip of document.querySelectorAll("[data-plan-month]")) {
        const [year, month] = trip.dataset.planMonth.split("-").map(Number);
        const monthsAway = (year - today.year) * 12 + month - today.month;
        // Only a month is known: never invent a departure day or mark a trip completed.
        trip.hidden = monthsAway < 0;
        if (!trip.hidden) upcomingPlans += 1;
        const status = trip.querySelector(".trip-status");
        status.textContent = monthsAway === 0 ? "This month" :
          monthsAway === 1 ? "Next month" : monthsAway > 1 ? `In ${monthsAway} months` : "";
        status.hidden = monthsAway < 0;
      }
      document.getElementById("plans").hidden = upcomingPlans === 0;
    }

    refreshPage();
    setInterval(refreshPage, 60000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshPage();
    });
  </script>
</body>
</html>
